name: Source and digital board tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r bench/requirements.txt
      - run: python tools/generate_gd32_pinout.py
      - run: python tools/build_evidence_catalog.py
      - run: python -m unittest discover -s tools -p test_evidence.py -v
      - run: python tools/validate_hardware_model.py
      - run: python tools/check_publication.py
      - run: python -m unittest discover -s tools -p test_qa4818n_trace.py -v
      - run: cc -std=c11 -Wall -Wextra -Werror firmware/rf/qa4818n_frequency.c firmware/rf/qa4818n_transport.c firmware/tests/test_qa4818n_frequency.c -o /tmp/test_qa4818n
      - run: /tmp/test_qa4818n
      - run: python -m unittest discover -s bench -v
      - run: python bench/contract_firmware.py work/contract.bin
      - run: python bench/run_hardware.py work/contract.bin --carrier match --instructions 12000 --out-dir work/contract

# QA4818N tests must run even if GitHub Pages build is disabled.
